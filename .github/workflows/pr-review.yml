name: Slack pull request review
run-name: Slack PR review ${{ github.event.client_payload.job_id }}

on:
  repository_dispatch:
    types: [slack_agent_pr_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: >-
      github.event.client_payload.job_id != '' &&
      github.event.client_payload.pull_request_number != '' &&
      github.event.client_payload.expected_head_sha != '' &&
      github.event.client_payload.model != '' &&
      github.event.client_payload.channel != '' &&
      github.event.client_payload.thread_ts != ''
    uses: sakomws/slack-agent-runtime/.github/workflows/pr-review-reusable.yml@508cd5dc32fcb9fa46cdeb9b8ff7fee7bb3e8507
    with:
      job_id: ${{ github.event.client_payload.job_id }}
      pull_request_number: ${{ fromJSON(github.event.client_payload.pull_request_number) }}
      expected_head_sha: ${{ github.event.client_payload.expected_head_sha }}
      model: ${{ github.event.client_payload.model }}
      slack_channel: ${{ github.event.client_payload.channel }}
      slack_thread_ts: ${{ github.event.client_payload.thread_ts }}
      require_successful_checks: true
      runtime_repository: sakomws/slack-agent-runtime
      runtime_ref: 508cd5dc32fcb9fa46cdeb9b8ff7fee7bb3e8507
    secrets:
      INFERENCE_ROUTER_BASE_URL: ${{ secrets.INFERENCE_ROUTER_BASE_URL }}
      INFERENCE_ROUTER_API_KEY: ${{ secrets.INFERENCE_ROUTER_API_KEY }}
      SLACK_CODING_BOT_TOKEN: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
      PR_REVIEW_GITHUB_TOKEN: ${{ secrets.PR_REVIEW_GITHUB_TOKEN }}
