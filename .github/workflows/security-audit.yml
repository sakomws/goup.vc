name: Slack security audit
run-name: Slack security audit ${{ github.event.client_payload.job_id }}

on:
  repository_dispatch:
    types: [slack_agent_security_audit]

permissions:
  contents: read

jobs:
  security-audit:
    if: >-
      github.event.client_payload.job_id != '' &&
      github.event.client_payload.channel != '' &&
      github.event.client_payload.thread_ts != '' &&
      github.event.client_payload.profile != '' &&
      github.event.client_payload.budget != '' &&
      github.event.client_payload.scope != ''
    uses: sakomws/slack-agent-runtime/.github/workflows/security-audit-reusable.yml@d3907c35e52ca3c9301f73d79ae7cb779812d0ed
    with:
      job_id: ${{ github.event.client_payload.job_id }}
      slack_channel: ${{ github.event.client_payload.channel }}
      slack_thread_ts: ${{ github.event.client_payload.thread_ts }}
      base_ref: ${{ github.event.repository.default_branch }}
      profile: ${{ github.event.client_payload.profile }}
      budget: ${{ fromJSON(github.event.client_payload.budget) }}
      scope: ${{ github.event.client_payload.scope }}
      runtime_repository: sakomws/slack-agent-runtime
      runtime_ref: d3907c35e52ca3c9301f73d79ae7cb779812d0ed
    secrets:
      INFERENCE_ROUTER_BASE_URL: ${{ secrets.INFERENCE_ROUTER_BASE_URL }}
      INFERENCE_ROUTER_API_KEY: ${{ secrets.INFERENCE_ROUTER_API_KEY }}
      INFERENCE_ROUTER_MODEL: ${{ secrets.INFERENCE_ROUTER_MODEL }}
      SLACK_CODING_BOT_TOKEN: ${{ secrets.SLACK_CODING_BOT_TOKEN }}
