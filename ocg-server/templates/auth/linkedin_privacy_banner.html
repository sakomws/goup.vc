{# Reassurance for first-time LinkedIn join or sign-in. -#}
<div id="linkedin-privacy-banner"
     class="mb-4 rounded-[1.75rem] border border-[#d8c7b2] bg-[#fffaf5] px-5 py-4 shadow-sm shadow-[#d8c7b2]/20"
     role="status">
  <div class="flex gap-3">
    <div class="svg-icon mt-0.5 size-4 shrink-0 icon-info bg-stone-700" aria-hidden="true"></div>
    <div>
      <p class="text-sm font-black tracking-tight text-stone-950">Your LinkedIn profile stays private.</p>
      <p class="mt-1 text-sm/6 font-medium text-stone-700">
        GOUP does not take or use information from your LinkedIn profile. LinkedIn is only used so you can join or sign in.
      </p>
    </div>
  </div>
</div>
